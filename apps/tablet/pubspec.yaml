name: tripling_table
description: "A shared tabletop companion for Magic, from Tripling Season."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  doubling_season:
    path: ../..
  provider: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  characters: ^1.4.0
  http: ^1.2.0
  crypto: ^3.0.6
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  share_plus: ^10.0.0
  wakelock_plus: ^1.4.0
  url_launcher: ^6.2.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Mana
      fonts:
        - asset: assets/fonts/mana.ttf
