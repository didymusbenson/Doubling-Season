name: Tablet app validation

on:
  pull_request:
    paths:
      - 'apps/tablet/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/tablet-build.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - id: web-build
        run: flutter build web --release --base-href "/Doubling-Season/tablet/" --pwa-strategy=none
      - name: Build Android release
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-web-and-android
          if-no-files-found: warn
          path: |
            apps/tablet/build/web
            apps/tablet/build/app/outputs/flutter-apk/app-release.apk

  browser-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tablet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/Doubling-Season/tablet/" --pwa-strategy=none
      - name: Exercise release UI in runner Chrome
        timeout-minutes: 8
        run: node tool/browser_feedback_smoke.mjs
      - name: Preserve browser interaction and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-browser-feedback-${{ github.sha }}
          path: apps/tablet/build/browser-smoke
          if-no-files-found: warn

  ipad-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/tablet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator
