name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/tablet-build.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter for original app
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build original web app
        run: flutter build web --release --base-href "/Doubling-Season/"

      - name: Setup Flutter for tablet app
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'

      - name: Build tablet web preview
        working-directory: apps/tablet
        # Do not introduce a second service worker/cache on the original origin.
        run: flutter build web --release --base-href "/Doubling-Season/tablet/" --pwa-strategy=none

      - name: Assemble and verify combined Pages site
        run: |
          test ! -e build/web/tablet
          cp -R apps/tablet/build/web build/web/tablet
          grep -F '<base href="/Doubling-Season/">' build/web/index.html
          grep -F '<base href="/Doubling-Season/tablet/">' build/web/tablet/index.html
          for app in build/web build/web/tablet; do
            test -s "$app/flutter_bootstrap.js"
            test -s "$app/main.dart.js"
            test -s "$app/manifest.json"
          done
          test -s build/web/tablet/assets/packages/doubling_season/assets/token_database.json
          test ! -s build/web/tablet/flutter_service_worker.js
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > build/web/deployment.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
